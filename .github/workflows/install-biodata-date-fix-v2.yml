name: Install biodata status sync v4

on:
  push:
    branches: [main]
    paths:
      - 'js/biodata-date-display-fix-v2.js'
      - 'tools/install_biodata_date_fix_v2.py'
      - '.github/workflows/install-biodata-date-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install biodata status sync
        run: python tools/install_biodata_date_fix_v2.py
      - name: Commit installation
        run: |
          if git diff --quiet -- backend/Code.gs biodata.html index.html js/admin-session-keepalive-v1.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs biodata.html index.html js/admin-session-keepalive-v1.js
          git commit -m "Aktifkan sinkron status Keluar Nonaktif akun Koordinator"
          git push
