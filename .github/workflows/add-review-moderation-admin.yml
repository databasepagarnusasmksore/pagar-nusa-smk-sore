name: Add review moderation admin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install review moderation admin
        run: python3 tools/install_review_moderation_admin.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backend/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m 'Hubungkan ulasan ke verifikasi admin'
          git push
