name: Aktifkan sinkron status Input Data Koordinator Aspel v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-aspel-status-labels-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sinkronkan status MENU INPUT DATA ke monitor Aspel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/aspel-monitor-v1.js')
          text = path.read_text(encoding='utf-8')

          anchor = "const savedValue=key=>{try{return localStorage.getItem(key)||sessionStorage.getItem(key)||''}catch(_){return sessionStorage.getItem(key)||''}};\n"
          helper = r'''

function workbookPersonKey(value){
  return String(value||'').trim().toLowerCase().replace(/\s+/g,' ');
}

function workbookStatusIndex(){
  const byId=new Map();
  const byName=new Map();
  const put=(id,name,membershipStatus,studentStatus,source)=>{
    const item={membershipStatus:String(membershipStatus||'').trim(),studentStatus:String(studentStatus||'').trim(),source:String(source||'')};
    const idKey=String(id||'').trim().toUpperCase();
    const nameKey=workbookPersonKey(name);
    if(idKey)byId.set(idKey,item);
    if(nameKey)byName.set(nameKey,item);
  };

  try{
    if(typeof students!=='undefined'&&Array.isArray(students)){
      students.forEach(person=>{
        if(!person)return;
        put(person.id,person.name,person.memberStatus,person.studentStatus,'Data Siswa');
      });
    }
  }catch(_){}

  try{
    if(typeof docs!=='undefined'&&docs&&docs['Data Keluar']&&typeof cellText==='function'&&typeof cellMaps!=='undefined'){
      for(let row=6;row<=300;row++){
        const id=String(cellText(docs['Data Keluar'],cellMaps['Data Keluar'],'D'+row)||'').trim();
        const name=String(cellText(docs['Data Keluar'],cellMaps['Data Keluar'],'E'+row)||'').trim();
        const finalStatus=String(cellText(docs['Data Keluar'],cellMaps['Data Keluar'],'G'+row)||'').trim();
        if((!id&&!name)||!finalStatus)continue;
        const normalized=workbookPersonKey(finalStatus);
        if(!(normalized.includes('keluar')||normalized.includes('nonaktif')||normalized.includes('non aktif')||normalized.includes('tidak aktif')))continue;
        put(id,name,finalStatus,'','Data Keluar');
      }
    }
  }catch(_){}

  return {byId,byName};
}

function applyWorkbookStatuses(data){
  if(!data||!Array.isArray(data.coordinators))return data;
  const index=workbookStatusIndex();
  const patch=person=>{
    if(!person)return;
    const idKey=String(person.memberId||'').trim().toUpperCase();
    const nameKey=workbookPersonKey(person.name);
    const live=(idKey&&index.byId.get(idKey))||(nameKey&&index.byName.get(nameKey));
    if(!live)return;
    if(live.membershipStatus)person.membershipStatus=live.membershipStatus;
    if(live.studentStatus)person.studentStatus=live.studentStatus;
    person.statusSource=live.source;
  };

  data.coordinators.forEach(coordinator=>{
    patch(coordinator);
    (coordinator.members||[]).forEach(member=>{
      patch(member);
      (member.candidates||[]).forEach(patch);
    });
    (coordinator.unassignedCandidates||[]).forEach(patch);
  });
  data.statusSource='Portal Biodata + MENU INPUT DATA';
  return data;
}
'''

          if 'function applyWorkbookStatuses(data)' not in text:
              if anchor not in text:
                  raise SystemExit('Anchor savedValue tidak ditemukan')
              text = text.replace(anchor, anchor + helper, 1)

          old_render = "function renderMonitor(){\n  const list=$('pnAspelList');"
          new_render = "function renderMonitor(){\n  if(monitorData)applyWorkbookStatuses(monitorData);\n  const list=$('pnAspelList');"
          if old_render in text:
              text = text.replace(old_render, new_render, 1)
          elif new_render not in text:
              raise SystemExit('Anchor renderMonitor tidak ditemukan')

          replacements = [
              ('Data dibaca langsung dari Portal Biodata Siswa. Urutan pemantauan: Koordinator → Anggota Koordinator → Anggota/Calon Anggota yang Didampingi.',
               'Relasi Koordinator dibaca dari Portal Biodata Siswa, sedangkan status terbaru disinkronkan otomatis dari MENU INPUT DATA (Data Siswa / Keluar-Nonaktif). Urutan: Koordinator → Anggota Koordinator → Anggota/Calon Anggota yang Didampingi.'),
              ('SUMBER: PORTAL BIODATA SISWA','SUMBER: BIODATA + MENU INPUT DATA'),
              ("setStatus('','Mengambil data terbaru dari Portal Biodata Siswa...');","setStatus('','Mengambil relasi Koordinator dan mencocokkan status terbaru dari MENU INPUT DATA...');"),
              ("monitorData=await jsonp('aspelMonitorAdminList',{token},23000);\n        renderMonitor();",
               "monitorData=await jsonp('aspelMonitorAdminList',{token},23000);\n        applyWorkbookStatuses(monitorData);\n        renderMonitor();"),
              ("setStatus('ok',`Data berhasil dimuat • ${Number(monitorData.summary?.coordinatorCount||0)} koordinator • ${Number(monitorData.summary?.candidateCount||0)} data dampingan.`);",
               "setStatus('ok',`Data berhasil dimuat • status MENU INPUT DATA tersinkron • ${Number(monitorData.summary?.coordinatorCount||0)} koordinator • ${Number(monitorData.summary?.candidateCount||0)} data dampingan.`);")
          ]
          for old,new in replacements:
              if old in text:
                  text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          compact=Path('js/admin-compact-v1.js')
          ctext=compact.read_text(encoding='utf-8')
          if 'js/aspel-monitor-v1.js?v=3' in ctext:
              ctext=ctext.replace('js/aspel-monitor-v1.js?v=3','js/aspel-monitor-v1.js?v=4',1)
          elif 'js/aspel-monitor-v1.js?v=4' not in ctext:
              raise SystemExit('Versi loader Aspel tidak ditemukan')
          compact.write_text(ctext,encoding='utf-8')

          index=Path('index.html')
          itext=index.read_text(encoding='utf-8')
          if 'js/admin-compact-v1.js?v=12' in itext:
              itext=itext.replace('js/admin-compact-v1.js?v=12','js/admin-compact-v1.js?v=13',1)
          elif 'js/admin-compact-v1.js?v=13' not in itext:
              raise SystemExit('Versi admin compact tidak ditemukan')
          index.write_text(itext,encoding='utf-8')
          PY

      - name: Commit hasil revisi
        run: |
          if git diff --quiet -- js/aspel-monitor-v1.js js/admin-compact-v1.js index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/aspel-monitor-v1.js js/admin-compact-v1.js index.html
          git commit -m "Sinkronkan status Input Data ke Koordinator Aspel"
          git push
